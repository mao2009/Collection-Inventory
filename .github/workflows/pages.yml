name: Publish collection browser

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/pages.yml"
  issues:
    types: [opened, edited, reopened, closed, labeled, unlabeled, deleted]
  pull_request:
    paths:
      - "site/**"
      - "data/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collection-pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      issues: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate public collection JSON from Issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build_catalog.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      # GitHub's artifact listing can lag the successful upload response.
      - name: Allow artifact metadata to become available
        run: sleep 15

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
